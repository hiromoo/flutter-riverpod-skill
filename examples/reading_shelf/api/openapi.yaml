openapi: 3.0.3
info:
  title: Reading Shelf API
  version: 1.0.0
  description: Local API for the Riverpod Flutter Reading Shelf sample.
servers:
  - url: http://localhost:8080
tags:
  - name: Books
  - name: ReadingEntries
paths:
  /books:
    get:
      tags: [Books]
      operationId: searchBooks
      summary: Search books by title or author
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
            default: ''
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Search result page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookSearchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
  /books/{bookId}:
    get:
      tags: [Books]
      operationId: getBook
      summary: Get a book by ID
      parameters:
        - $ref: '#/components/parameters/BookId'
      responses:
        '200':
          description: Book details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          $ref: '#/components/responses/NotFound'
  /reading-entries:
    get:
      tags: [ReadingEntries]
      operationId: listReadingEntries
      summary: List all reading entries
      responses:
        '200':
          description: Reading entries sorted by update time descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReadingEntry'
  /reading-entries/{bookId}:
    parameters:
      - $ref: '#/components/parameters/BookId'
    get:
      tags: [ReadingEntries]
      operationId: getReadingEntry
      summary: Get the reading entry for a book
      responses:
        '200':
          description: Reading entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingEntry'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [ReadingEntries]
      operationId: putReadingEntry
      summary: Create or update a reading entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveReadingEntryRequest'
      responses:
        '200':
          description: Saved reading entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [ReadingEntries]
      operationId: deleteReadingEntry
      summary: Delete a reading entry
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    BookId:
      name: bookId
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    Book:
      type: object
      required: [id, title, author, description, pageCount, publishedYear, genre]
      properties:
        id:
          type: string
        title:
          type: string
        author:
          type: string
        description:
          type: string
        pageCount:
          type: integer
          minimum: 1
        publishedYear:
          type: integer
        genre:
          type: string
    BookSearchResult:
      type: object
      required: [items, page, pageSize, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Book'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    ReadingStatus:
      type: string
      enum: [wantToRead, reading, finished]
    ReadingEntry:
      type: object
      required: [bookId, status, pagesRead, note, updatedAt]
      properties:
        bookId:
          type: string
        status:
          $ref: '#/components/schemas/ReadingStatus'
        pagesRead:
          type: integer
          minimum: 0
        rating:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        note:
          type: string
          maxLength: 2000
        updatedAt:
          type: string
          format: date-time
    SaveReadingEntryRequest:
      type: object
      required: [status, pagesRead, note]
      properties:
        status:
          $ref: '#/components/schemas/ReadingStatus'
        pagesRead:
          type: integer
          minimum: 0
        rating:
          type: integer
          minimum: 1
          maximum: 5
          nullable: true
        note:
          type: string
          maxLength: 2000
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
